# DocuMind AI — whole system in one command:
#   copy .env.example .env   (fill in GROQ_API_KEY / GEMINI_API_KEY and a real DJANGO_SECRET_KEY)
#   docker compose up --build
#   open http://localhost:8080
# Optional demo data:  docker compose exec backend python manage.py seed_demo

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: docuvault_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mysecretpassword}
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d docuvault_db"]
      interval: 5s
      retries: 20

  backend:
    build: .
    env_file: .env
    environment: &backend-env
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: docuvault_db
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      CORS_ORIGINS: http://localhost:8080
      APP_URL: http://localhost:8080
    command: sh -c "python manage.py migrate --noinput && gunicorn backend.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"
    volumes: [media:/app/media, models:/app/ml/models, hf-cache:/data/hf-cache]
    depends_on: { db: { condition: service_healthy } }
    restart: unless-stopped
    healthcheck:   # API answers and can reach the database
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 90s

  worker:
    build: .
    env_file: .env
    environment: *backend-env
    command: python manage.py run_worker
    volumes: [media:/app/media, models:/app/ml/models, hf-cache:/data/hf-cache]
    depends_on: { db: { condition: service_healthy }, backend: { condition: service_healthy } }   # healthy = migrations done
    restart: unless-stopped
    healthcheck:   # the worker touches a heartbeat file on every loop (every 2 s when idle; a large document can keep it busy for minutes)
      test: ["CMD", "python", "-c", "import os, sys, tempfile, time; p = os.path.join(tempfile.gettempdir(), 'documind-worker.heartbeat'); sys.exit(0 if os.path.exists(p) and time.time() - os.path.getmtime(p) < 1800 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  web:
    build: ./frontend
    ports: ["8080:80"]
    depends_on: { backend: { condition: service_healthy } }
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  db-data:
  media:
  models:
  hf-cache:
