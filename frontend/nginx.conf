server {
    listen 80;
    client_max_body_size 30m;

    root /usr/share/nginx/html;
    index index.html;

    # API, admin and their static files go to Django
    # streamed answers: pass each line through as soon as Django writes it
    location /api/assistant/ask/stream/ { proxy_pass http://backend:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_buffering off; proxy_cache off; proxy_read_timeout 180s; }
    location /api/ { proxy_pass http://backend:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_read_timeout 180s; }
    location /admin/ { proxy_pass http://backend:8000; proxy_set_header Host $host; }
    location /static/ { proxy_pass http://backend:8000; }
    location /media/avatars/ { proxy_pass http://backend:8000; }

    # long-lived caching for hashed build assets
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }

    # single-page app: every other path serves index.html
    location / { try_files $uri $uri/ /index.html; }
}
